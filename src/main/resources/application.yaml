spring:
  application:
    name: smart-list-api

  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:smart_list.db

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

server:
  port: 8080